plugins {
    id 'java'
    id 'application'
}

group = 'com.tournament'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'Main'
}

dependencies {
    // BOM JUnit 5 pour gérer automatiquement les versions
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}